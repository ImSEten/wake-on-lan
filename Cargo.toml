[workspace]
members = [
    "crates/wake-on-lan-server",
    "crates/common",
    "crates/backend",
    "crates/mdns",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = { version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio = { version = "1.53", features = ["full"] }
clap = { version = "4.6" }
axum = { version = "0.8.9" }
